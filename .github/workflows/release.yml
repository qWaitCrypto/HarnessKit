name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0-alpha.4
        required: true
        type: string

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Package
        run: |
          bash scripts/package-release.sh \
            --target "${{ matrix.target }}" \
            --version "${{ inputs.version }}" \
            --dist-dir dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: harnesskit-${{ matrix.target }}
          path: dist/harnesskit-${{ matrix.target }}.tar.gz

  checksums:
    name: Build checksums
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum harnesskit-*.tar.gz > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
