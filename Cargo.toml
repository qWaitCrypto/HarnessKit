[package]
name = "harnesskit"
version = "0.1.0-alpha.6"
edition = "2021"
description = "A lightweight file-first repo context harness for coding agents."
license = "MIT"
repository = "https://github.com/qWaitCrypto/HarnessKit"
publish = false

[dependencies]
# Keep clap compatible with the Rust 1.75 toolchain used by local builds.
clap = { version = "~4.4.18", features = ["derive"] }
globset = "=0.4.15"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "float_roundtrip"] }
